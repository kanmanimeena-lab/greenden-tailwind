<input type = "text" class = "input">

<div class = "container">

<p>Ragul</p>
<p>Meena</p>
<p>David</p>
<p>Priya</p>
<p>John</p>

</div>

<script>

let input = document.querySelector(".input");

let container = document.querySelector(".container");

let pList = container.querySelectorAll("p");

input.addEventListener("keyup",function(){

  let eneteredvalue = event.target.value.toUpperCase();

  for(i=0 ; i <pList.length; i++){

    if(pList[i].textContent.toUpperCase().indexOf(eneteredvalue)<0){

    pList[i].style.display = "none";
  }else{

    pList[i].style.display = "block";
    console.log(pList);
  }
  
  }
})
</script>

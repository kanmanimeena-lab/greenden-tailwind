<!DOCTYPE html>
<html>
  <head>
    <style>
.container{

  background-color: skyblue;
  display: grid;
  grid-template-rows: 1fr 3fr 1fr;
  
}
.header{

  display: grid;
  justify-content: center;
  align-items: center;
  background-color: teal;
}

.middle{
margin-top:5px;
  display: grid;
  grid-template-columns: 1fr 3fr;
gap:10px;

}

.aside{

  background-color: green;

display: grid;
  justify-content: center;
  align-items: center;
}

.article{

  display: grid;
  background-color: rosybrown;
    justify-content: center;
  align-items: center;
}

.image{

  display:grid;
  justify-content: center;
  align-items: center;
 background-color: yellow;
  height:100px;
  
 
}
.image-container{

  display: grid;
  grid-template-columns: 100px 100px 100px;
 gap:20px;
 
}

.footer{
  

  background-color: teal;
display: grid;
justify-content: center;
align-items: center;
height: 100px;
margin-top:5px;
}

    </style>
    <body>
 <div class = "container">

  <div class = "header">Header</div> 
  
  <div class = "middle"> 

     <div class = "aside">Aside</div> 

     <div class = "article">Article
     
       <div class = "image-container">
        <div class = "image">image</div>
        <div class = "image">image</div>
        <div class= "image">image</div>
       </div>
      </div>
  </div>

 <div class = "footer">Footer</div>

 </div> 

    </body>
  </head>
</html>
